<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WipyBot Dashboard</title>
    <meta name="description" content="WipyBot admin dashboard">
    <meta name="dashboard-base-path" content="__DASHBOARD_BASE_PATH__">
    <link rel="stylesheet" href="__DASHBOARD_CSS_URL__">
</head>
<body>
    <main class="shell">
        <header class="panel hero">
            <div>
                <p class="kicker">WipyBot</p>
                <h1>Infrastructure Dashboard</h1>
                <p class="muted">Matchmaking has been removed. This dashboard is ready for the raid signup feature.</p>
            </div>
            <div class="actions">
                <span id="lastUpdated" class="pill">Last sync: --</span>
                <button id="refreshBtn" type="button">Refresh</button>
            </div>
        </header>

        <section class="grid">
            <article class="panel metric">
                <p class="label">Bot Status</p>
                <p id="botStatus" class="value">--</p>
            </article>
            <article class="panel metric">
                <p class="label">Bot User</p>
                <p id="botUser" class="value small">--</p>
            </article>
            <article class="panel metric">
                <p class="label">Connected Guilds</p>
                <p id="connectedGuilds" class="value">--</p>
            </article>
            <article class="panel metric">
                <p class="label">Configured Guilds</p>
                <p id="configuredGuilds" class="value">--</p>
            </article>
        </section>

        <section class="panel">
            <header class="section-header">
                <h2>Guild Configuration</h2>
                <span class="pill">SQLite</span>
            </header>
            <div id="guildList" class="content state">Loading guilds...</div>
        </section>

        <section class="panel">
            <header class="section-header">
                <h2>Runtime Logs</h2>
                <span class="pill">events.jsonl</span>
            </header>
            <div class="log-actions">
                <button id="downloadLogsBtn" type="button">Download logs</button>
                <button id="clearLogsBtn" type="button" class="danger">Clear logs</button>
            </div>
            <p id="adminStatus" class="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="__DASHBOARD_JS_URL__" defer></script>
</body>
</html>
